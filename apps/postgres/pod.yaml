apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: dev
  labels:
    app: postgres
spec:
  containers:
  - name: postgres
    image: postgres:15-alpine
    ports:
    - containerPort: 5432
    env:
    - name: POSTGRES_USER
      value: "admin"
    - name: POSTGRES_PASSWORD
      value: "secretpassword"
    - name: POSTGRES_DB
      value: "orders"